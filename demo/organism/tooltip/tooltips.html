<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AT Grid - Tooltips</title>
    <link rel="stylesheet" href="../../colormode-globalstyle/dynamic.css">
    <link rel="stylesheet" href="../../../css/atomic.css">
    <style>
        :root {
            --at-m: 20px 0;

        }

        .at-ctnr {

            --at-p: 100px;
        }



        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
        }



        /* Identity class, private namespace.

           Nothing outside this component seeds `--at-ttip-*`, so no ancestor can
           repaint it — the shared-channel failure the skill documents under
           "Why the namespace is private". Only the two values `.at-ttip.show`
           re-points need to be tokens; the rest are written once, so they are
           plain declarations. */
        .at-ttip {
            /* Arms — the only two with a second writer. */
            --at-ttip-vis: hidden;
            --at-ttip-opa: 0;

            /* The component's own palette, read by the shell and its four
               arrow sides. Private, so no ancestor can reach it. */
            --at-ttip-bg-cl: rgba(0, 0, 0, 0.8);
            --at-ttip-cl: #fff;
            --at-ttip-bdr-w: 6px;

            /* The shared stacking scale, seeded here and applied by the `.at-z-idx`
               applier the script puts on the element — not read back in this rule. */
            --at-z-idx: 1;

            /* Duration has a second writer: the motion preference below. */
            --at-ttip-trs-dur: .3s;

            position: absolute;
            padding: 8px;
            text-align: center;
            background-color: var(--at-ttip-bg-cl);
            color: var(--at-ttip-cl);
            border-radius: 5px;
            font-size: 13px;
            visibility: var(--at-ttip-vis);
            opacity: var(--at-ttip-opa);
            transition: opacity var(--at-ttip-trs-dur) 0s, visibility var(--at-ttip-trs-dur) 0s;
        }

        /* WCAG 2.2 §2.3.3 — the same gate the skill documents for `.at-trs`. */
        @media (prefers-reduced-motion: reduce) {
            .at-ttip { --at-ttip-trs-dur: 0s; }
        }

        .at-ttip:after {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
        }

        .at-ttip.top:after {
            border-left: var(--at-ttip-bdr-w) solid transparent;
            border-right: var(--at-ttip-bdr-w) solid transparent;
            border-top: var(--at-ttip-bdr-w) solid var(--at-ttip-bg-cl);
            left: 50%;
            bottom: calc(-1 * var(--at-ttip-bdr-w));
            transform: translateX(-50%);
        }

        .at-ttip.right:after {
            border-top: var(--at-ttip-bdr-w) solid transparent;
            border-bottom: var(--at-ttip-bdr-w) solid transparent;
            border-right: var(--at-ttip-bdr-w) solid var(--at-ttip-bg-cl);
            top: 50%;
            left: calc(-1 * var(--at-ttip-bdr-w));
            transform: translateY(-50%);
        }

        .at-ttip.bottom:after {
            border-left: var(--at-ttip-bdr-w) solid transparent;
            border-right: var(--at-ttip-bdr-w) solid transparent;
            border-bottom: var(--at-ttip-bdr-w) solid var(--at-ttip-bg-cl);
            left: 50%;
            top: calc(-1 * var(--at-ttip-bdr-w));
            transform: translateX(-50%);
        }

        .at-ttip.left:after {
            border-top: var(--at-ttip-bdr-w) solid transparent;
            border-bottom: var(--at-ttip-bdr-w) solid transparent;
            border-left: var(--at-ttip-bdr-w) solid var(--at-ttip-bg-cl);
            right: calc(-1 * var(--at-ttip-bdr-w));
            top: 50%;
            transform: translateY(-50%);
        }

        .at-ttip.show {
            --at-ttip-vis: visible;
            --at-ttip-opa: 1;
        }


        .at-btn-grp {
            gap: 20px;
        }

        /* ------------------------------------------------
        AT Tooltip Base Styles
        -------------------------------------------------*/

        /* Same private namespace as the script-driven tooltip above. This
           variant is driven by `:hover`/`:focus` instead of a class, so its two
           arms are the media-ish selectors below rather than `.at-ttip.show`. */
        [aria-label][role~="tooltip"] {
            /* The one shared channel: this component's own stacking step. Seeded
               here and applied by the `at-z-idx` applier in the markup. */
            --at-z-idx: 10;

            /* Only the arrow's box, read by ::before. */
            --at-cstip-arrow-h: 6px;
            --at-cstip-arrow-w: 18px;

            position: relative;
        }

        [aria-label][role~="tooltip"]::before,
        [aria-label][role~="tooltip"]::after {
            /* Arms — `:hover`/`:focus` re-points both. */
            --at-cstip-opa: 0;

            position: absolute;
            /* The host seeds `--at-z-idx`; a pseudo-element cannot carry the
               `.at-z-idx` applier class, so it reads the token directly. */
            z-index: var(--at-z-idx);
            transform: translate3d(0, 0, 0);
            transform-origin: top;
            backface-visibility: hidden;
            will-change: transform;
            opacity: var(--at-cstip-opa);
            pointer-events: none;
            /* Named properties, not the `all` shorthand — `transition: all`
               also animates every layout-triggering property that happens to
               change. Only `opacity` and `transform` are animated here. */
            transition: opacity var(--at-trs-duration, .18s) var(--at-trs-easing, ease-in-out) var(--at-trs-delay, 0s),
                        transform var(--at-trs-duration, .18s) var(--at-trs-easing, ease-in-out) var(--at-trs-delay, 0s);
            box-sizing: border-box;
        }

        [aria-label][role~="tooltip"]::before {
            background-size: 100% auto;
            content: "";
            height: var(--at-cstip-arrow-h);
            width: var(--at-cstip-arrow-w);
        }

        [aria-label][role~="tooltip"]::after {
            background: rgba(17, 17, 17, .9);
            border-radius: 4px;
            color: #fff;
            content: attr(aria-label);
            font-size: 14px;
            font-weight: 400;
            margin: 0;
            padding: .5em 1em;
            white-space: nowrap;
            box-sizing: content-box;
        }

        [aria-label][role~="tooltip"]:hover::before,
        [aria-label][role~="tooltip"]:hover::after,
        [aria-label][role~="tooltip"]:focus::before,
        [aria-label][role~="tooltip"]:focus::after {
            --at-cstip-opa: 1;
            pointer-events: auto;
        }



        /* ------------------------------------------------
        AT Tooltip Position Modifiers
        -------------------------------------------------*/

        [role~="tooltip"][data-position|="top"]::before {background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2236px%22%20height%3D%2212px%22%3E%3Cpath%20fill%3D%22rgba%2817,%2017,%2017,%200.9%29%22%20transform%3D%22rotate%280%29%22%20d%3D%22M2.658,0.000%20C-13.615,0.000%2050.938,0.000%2034.662,0.000%20C28.662,0.000%2023.035,12.002%2018.660,12.002%20C14.285,12.002%208.594,0.000%202.658,0.000%20Z%22/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            margin: 0 0 5px 0;
        }

        [role~="tooltip"][data-position|="top"]::after {margin: 0 0 11px 0;
        }

        [role~="tooltip"][data-position|="top"]::before {--at-cstip-tf: translate3d(-50%, 0, 0);
            transform: var(--at-cstip-tf);
            bottom: 100%;
            left: 50%;
        }

        [role~="tooltip"][data-position|="top"]:hover::before {--at-cstip-tf: translate3d(-50%, -5px, 0);
            transform: var(--at-cstip-tf);
        }

        [role~="tooltip"][data-position|="top"]::after {--at-cstip-tf: translate3d(-50%, 0, 0);
            transform: var(--at-cstip-tf);
            bottom: 100%;
            left: 50%;
        }

        [role~="tooltip"][data-position="top"]:hover::after {--at-cstip-tf: translate3d(-50%, -5px, 0);
            transform: var(--at-cstip-tf);
        }

        /* ------------------------------------------------
        AT Tooltip - Top Left
        -------------------------------------------------*/
        [role~="tooltip"][data-position="top-left"]::after {--at-cstip-tf: translate3d(calc(-100% + 16px), 0, 0);
            transform: var(--at-cstip-tf);
            bottom: 100%;
        }

        [role~="tooltip"][data-position="top-left"]:hover::after {--at-cstip-tf: translate3d(calc(-100% + 16px), -5px, 0);
            transform: var(--at-cstip-tf);
        }


        /* ------------------------------------------------
        AT Tooltip - Top Right
        -------------------------------------------------*/
        [role~="tooltip"][data-position="top-right"]::after {--at-cstip-tf: translate3d(calc(0% + -16px), 0, 0);
            transform: var(--at-cstip-tf);
            bottom: 100%;
        }

        [role~="tooltip"][data-position="top-right"]:hover::after {--at-cstip-tf: translate3d(calc(0% + -16px), -5px, 0);
            transform: var(--at-cstip-tf);
        }


        /* ------------------------------------------------
        AT Tooltip - Bottom
        -------------------------------------------------*/
        [role~="tooltip"][data-position|="bottom"]::before {background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2236px%22%20height%3D%2212px%22%3E%3Cpath%20fill%3D%22rgba%2817,%2017,%2017,%200.9%29%22%20transform%3D%22rotate%28180%2018%206%29%22%20d%3D%22M2.658,0.000%20C-13.615,0.000%2050.938,0.000%2034.662,0.000%20C28.662,0.000%2023.035,12.002%2018.660,12.002%20C14.285,12.002%208.594,0.000%202.658,0.000%20Z%22/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            margin: 5px 0 0 0;
        }

        [role~="tooltip"][data-position|="bottom"]::after {margin: 11px 0 0 0;
        }

        [role~="tooltip"][data-position|="bottom"]::before {--at-cstip-tf: translate3d(-50%, -10px, 0);
            transform: var(--at-cstip-tf);
            bottom: auto;
            top: 100%;
            left: 50%;
        }

        [role~="tooltip"][data-position|="bottom"]:hover::before {--at-cstip-tf: translate3d(-50%, 0, 0);
            transform: var(--at-cstip-tf);
        }

        [role~="tooltip"][data-position|="bottom"]::after {--at-cstip-tf: translate3d(-50%, -10px, 0);
            transform: var(--at-cstip-tf);
            top: 100%;
            left: 50%;
        }

        [role~="tooltip"][data-position="bottom"]:hover::after {--at-cstip-tf: translate3d(-50%, 0, 0);
            transform: var(--at-cstip-tf);
        }


        /* ------------------------------------------------
        AT Tooltip - Bottom Left
        -------------------------------------------------*/
        [role~="tooltip"][data-position="bottom-left"]::after {--at-cstip-tf: translate3d(calc(-100% + 16px), -10px, 0);
            transform: var(--at-cstip-tf);
            top: 100%;
        }

        [role~="tooltip"][data-position="bottom-left"]:hover::after {--at-cstip-tf: translate3d(calc(-100% + 16px), 0, 0);
            transform: var(--at-cstip-tf);
        }


        /* ------------------------------------------------
        AT Tooltip - Bottom Right
        -------------------------------------------------*/
        [role~="tooltip"][data-position="bottom-right"]::after {--at-cstip-tf: translate3d(calc(0% + -16px), -10px, 0);
            transform: var(--at-cstip-tf);
            top: 100%;
        }

        [role~="tooltip"][data-position="bottom-right"]:hover::after {--at-cstip-tf: translate3d(calc(0% + -16px), 0, 0);
            transform: var(--at-cstip-tf);
        }


        /* ------------------------------------------------
       AT Tooltip - Left
        -------------------------------------------------*/
        [role~="tooltip"][data-position="left"]::before,
        [role~="tooltip"][data-position="left"]::after {--at-cstip-tf: translate3d(10px, -50%, 0);
            transform: var(--at-cstip-tf);
            top: 50%;
            left: auto;
            bottom: auto;
            right: 100%;
        }

        [role~="tooltip"][data-position="left"]::before {background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2212px%22%20height%3D%2236px%22%3E%3Cpath%20fill%3D%22rgba%2817,%2017,%2017,%200.9%29%22%20transform%3D%22rotate%28-90%2018%2018%29%22%20d%3D%22M2.658,0.000%20C-13.615,0.000%2050.938,0.000%2034.662,0.000%20C28.662,0.000%2023.035,12.002%2018.660,12.002%20C14.285,12.002%208.594,0.000%202.658,0.000%20Z%22/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            height: 18px;
            width: 6px;
            margin: 0 5px 0 0;
        }

        [role~="tooltip"][data-position="left"]::after {margin: 0 11px 0 0;
        }

        [role~="tooltip"][data-position="left"]:hover::before,
        [role~="tooltip"][data-position="left"]:hover::after {--at-cstip-tf: translate3d(0, -50%, 0);
            transform: var(--at-cstip-tf);
        }


        /* ------------------------------------------------
        AT Tooltip - Right
        -------------------------------------------------*/
        [role~="tooltip"][data-position="right"]::before,
        [role~="tooltip"][data-position="right"]::after {--at-cstip-tf: translate3d(-10px, -50%, 0);
            bottom: auto;
            top: 50%;
            left: 100%;
            transform: var(--at-cstip-tf);
        }

        [role~="tooltip"][data-position="right"]::before {background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2212px%22%20height%3D%2236px%22%3E%3Cpath%20fill%3D%22rgba%2817,%2017,%2017,%200.9%29%22%20transform%3D%22rotate%2890%206%206%29%22%20d%3D%22M2.658,0.000%20C-13.615,0.000%2050.938,0.000%2034.662,0.000%20C28.662,0.000%2023.035,12.002%2018.660,12.002%20C14.285,12.002%208.594,0.000%202.658,0.000%20Z%22/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            height: 18px;
            width: 6px;
            margin: 0 0 0 5px;
        }

        [role~="tooltip"][data-position="right"]::after {margin: 0 0 0 11px;
        }

        [role~="tooltip"][data-position="right"]:hover::before,
        [role~="tooltip"][data-position="right"]:hover::after {--at-cstip-tf: translate3d(0, -50%, 0);
            transform: var(--at-cstip-tf);
        }

        /* ------------------------------------------------
        AT Tooltip Size
        -------------------------------------------------*/
        [role~="tooltip"][data-tooltip-size="small"]::after {width: 80px;
            white-space: initial;
        }

        [role~="tooltip"][data-tooltip-size="medium"]::after {width: 150px;
            white-space: initial;
        }

        [role~="tooltip"][data-tooltip-size="large"]::after {width: 260px;
            white-space: initial;
        }
    </style>
</head>

<body>
    <div class="at-ctnr at-p">
        <h4 class="at-m">Tooltips With JS</h4>

        <button type="button" class="at-btn" data-placement="top" data-tooltip="Tooltip on top">Tooltip on top</button>
        <button type="button" class="at-btn" data-placement="right" data-tooltip="Tooltip on right">Tooltip on
            right</button>
        <button type="button" class="at-btn" data-placement="bottom" data-tooltip="Tooltip on bottom">Tooltip on
            bottom</button>
        <button type="button" class="at-btn" data-placement="left" data-tooltip="Tooltip on left">Tooltip on
            left</button>


    </div>

    <div class="at-ctnr at-p">
        <h4 class="at-m">Tooltips With CSS</h4>
        <div class="at-btn-grp at-gap at-flx at-flx-wrp">

            <button class="at-btn" aria-label="Hey tooltip!" data-position="top-left" role="tooltip">
                Tooltip on top left
            </button>

            <button class="at-btn" aria-label="Hey tooltip!" data-position="top" role="tooltip">
                Tooltip on top
            </button>
            <button class="at-btn" aria-label="This is a decently long text!" data-position="top-right"
                data-tooltip-size="medium" role="tooltip">
                Tooltip on top right
            </button>

            <button class="at-btn" aria-label="This is a decently long text!" data-position="left"
                data-tooltip-size="medium" role="tooltip">
                Tooltip on left
            </button>

            <button class="at-btn" aria-label="This is a decently long text!" data-position="right"
                data-tooltip-size="medium" role="tooltip">
                Tooltip on right
            </button>

            <button class="at-btn" aria-label="Hey tooltip!" data-position="bottom-left" role="tooltip">
                Tooltip on bottom left
            </button>

            <button class="at-btn" aria-label="Hey tooltip!" data-position="bottom" role="tooltip">
                Tooltip on
                bottom</button>

            <button class="at-btn" aria-label="This is a decently long text!" data-position="bottom-right"
                data-tooltip-size="medium" role="tooltip">
                Tooltip on bottom right
            </button>

            <a class="at-btn" aria-label="This is a decently long text!" data-position="bottom-right"
                data-tooltip-size="medium" role="tooltip">
                Tooltip on bottom right
            </a>

            <p class="at-btn at-m" aria-label="This is a decently long text!" data-position="bottom-right"
                data-tooltip-size="medium" role="tooltip">
                Tooltip on bottom right
            </p>

        </div>


    </div>



    <script>
        const buttons = document.querySelectorAll('[data-tooltip]');

        buttons.forEach(button => {
            const tooltip = document.createElement('div');
            // `at-ttip` seeds `--at-z-idx: 1`; `at-z-idx` is the applier that
            // reads it. Two classes, one channel — the identity class never reads
            // back the token it seeded.
            tooltip.classList.add('at-ttip', 'at-z-idx');
            tooltip.innerText = button.getAttribute('data-tooltip');

            const positionTooltip = (x, y, placement) => {
                tooltip.style.left = x + 'px';
                tooltip.style.top = y + 'px';
                tooltip.classList.add(placement);
                tooltip.classList.add('show');
                document.body.appendChild(tooltip);
            };

            const removeTooltip = () => {
                tooltip.classList.remove('show');
                tooltip.classList.remove('top', 'bottom', 'left', 'right');
                document.body.removeChild(tooltip);
            };

            button.addEventListener('mouseenter', () => {
                const rect = button.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                const placement = button.getAttribute('data-placement');
                const offsetX = button.getAttribute('data-offset-x') || 0;
                const offsetY = button.getAttribute('data-offset-y') || 0;

                let tooltipX, tooltipY;

                switch (placement) {
                    case 'top':
                        tooltipX = centerX;
                        tooltipY = rect.top + window.pageYOffset - tooltip.offsetHeight - offsetY;
                        break;
                    case 'bottom':
                        tooltipX = centerX;
                        tooltipY = rect.bottom + window.pageYOffset + offsetY;
                        break;
                    case 'left':
                        tooltipX = rect.left + window.pageXOffset - tooltip.offsetWidth - offsetX;
                        tooltipY = centerY;
                        break;
                    case 'right':
                        tooltipX = rect.right + window.pageXOffset + offsetX;
                        tooltipY = centerY;
                        break;
                    default:
                        tooltipX = centerX;
                        tooltipY = rect.top + window.pageYOffset - tooltip.offsetHeight - offsetY;
                }

                positionTooltip(tooltipX, tooltipY, placement);
            });

            button.addEventListener('mouseleave', removeTooltip);
        });

    </script>

</body>

</html>
