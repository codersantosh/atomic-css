name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS (includes parity + naming checks)
        run: npm run build

      - name: Lint SCSS
        run: npm run lint

      - name: Check for unexpected diff in committed CSS output
        run: git diff --exit-code -- css css-max demo/colormode-globalstyle
